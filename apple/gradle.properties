# apple/ build only -- the repo-root gradle.properties is not inherited (separate build).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
# On Linux the iOS targets cannot compile (no Xcode / Darwin SDK). Skip them quietly instead of
# warning on every invocation; the macOS lane builds them for real.
kotlin.native.ignoreDisabledTargets=true
# Deliberately NO org.gradle.caching (a cache hit would restore results without running tests).
