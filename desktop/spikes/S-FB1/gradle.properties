# Spikes are built on a shared machine/CI runner next to other Gradle builds. The shared Kotlin
# compile daemon (default strategy) OOM'd when several builds joined it (observed 2026-10-14), so
# compile in-process inside this build's own Gradle daemon instead.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true
