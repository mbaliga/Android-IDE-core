[versions]
agp = "8.9.1"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"
coreKtx = "1.15.0"
coroutines = "1.10.1"
lifecycle = "2.8.7"
activityCompose = "1.10.0"
# Bumped from 2025.01.00 (Foundation 1.7.6) into the 1.8 line so BasicText's TextAutoSize overload
# (BasicText-CL7eQgs) exists — the markdown renderer 0.35.0 is built against Foundation 1.8 and
# NoSuchMethodError'd every model/markdown turn (incl. the restored-conversation launch crash).
composeBom = "2025.05.01"
room = "2.7.1"
okhttp = "4.12.0"
mlkitText = "16.0.1"
junit = "4.13.2"
# Pure-Compose markdown rendering (parser: org.jetbrains:markdown). No network,
# no telemetry. 0.35.x targets the Compose 1.7 line this project's BOM pins.
markdownRenderer = "0.35.0"
# SSH/SFTP for the remote-exec spine (data/remote). Actively maintained, modern
# algorithms (ed25519, modern KEX/ciphers). Pulls BouncyCastle + eddsa transitively.
sshj = "0.39.0"
# §1.8 license gate: com.github.jk1's dependency-license-report — generates a report of
# every runtime dependency's license and fails the build on anything off the allowlist.
licenseReport = "3.1.4"
# Search index substrate (FONEBREW_SEARCH_SPEC.md D1): Room has no @Fts5 (only @Fts3/@Fts4,
# per AOSP's system SQLite build), so the FTS5 candidate-generation layer is SQLDelight over a
# bundled SQLite build instead — coexisting with Room, which stays the message-tree store.
#
# Pinned to 2.1.0, NOT the spec's originally-cited 2.3.2 — verified empirically (see the
# WP3 commit): SQLDelight's Gradle *plugin* pulls kotlin-gradle-plugin as a runtime dependency
# of its own plugin classpath (2.1.0->2.0.20, 2.2.1->2.2.21, 2.3.x->2.3.10 — checked each POM
# directly), and this project's shared plugin classpath resolves the highest of those against
# every other applied plugin (kotlin.android, kotlin.compose, ksp). 2.3.2 forced a project-wide
# Kotlin Gradle Plugin bump to 2.3.10, which breaks KSP 2.1.0-1.0.29 (Room's processor) outright
# and would have forced a matching Kotlin/Compose-compiler bump — risking the deliberately
# pinned Compose BoM 1.8/markdown-renderer combination (see this file's composeBom comment).
# 2.1.0 requires kotlin-gradle-plugin 2.0.20, which is *below* this project's existing 2.1.0
# pin, so it changes nothing else. The 2.3.2 changelog line the spec cited (FTS5 virtual-table
# synthesized-column dialect support) isn't used by this schema, so nothing is lost.
sqldelight = "2.1.0"
# androidx.sqlite's own KMP driver artifact, wrapped for a plain (non-multiplatform) Android
# module by eygraber. Same androidx.sqlite:sqlite-bundled runtime underneath.
sqldelightAndroidxDriver = "0.0.1"
# SQLite 3.50.1 built with SQLITE_ENABLE_FTS5 (AOSP's system SQLite is FTS3/4 only). Also
# resolves on plain JVM (linux/mac/windows host binaries) — see SearchDatabaseFactoryTest,
# which runs a real FTS5 query in a JVM unit test against this exact artifact.
sqliteBundled = "2.7.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

markdown-renderer-m3 = { group = "com.mikepenz", name = "multiplatform-markdown-renderer-m3", version.ref = "markdownRenderer" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-sse = { group = "com.squareup.okhttp3", name = "okhttp-sse", version.ref = "okhttp" }
sshj = { group = "com.hierynomus", name = "sshj", version.ref = "sshj" }
mlkit-text = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitText" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

sqldelight-runtime = { group = "app.cash.sqldelight", name = "runtime", version.ref = "sqldelight" }
sqldelight-coroutines-extensions = { group = "app.cash.sqldelight", name = "coroutines-extensions", version.ref = "sqldelight" }
sqldelight-androidx-driver = { group = "com.eygraber", name = "sqldelight-androidx-driver", version.ref = "sqldelightAndroidxDriver" }
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqliteBundled" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
license-report = { id = "com.github.jk1.dependency-license-report", version.ref = "licenseReport" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
