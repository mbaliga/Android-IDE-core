name: Desktop host core

# LX-1: compile and test the pure domain/ + contracts/ sources on a plain JDK 17, no Android
# SDK, in the separate desktop/ Gradle build. Compile-and-test only: no artifacts are produced.
# Read-only token. Action pins follow ci.yml's tags; pin to SHAs when the owner enables it.

on:
  pull_request:
    paths:
      - "desktop/**"
      - "contracts/kotlin/**"
      - "core-engine/src/main/java/dev/aarso/domain/**"
      - "core-engine/src/test/java/dev/aarso/domain/**"
      - ".github/workflows/desktop-host-core.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-host-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-host:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Host JVM tests (no Android SDK)
        working-directory: desktop
        run: ./gradlew --no-daemon :core-host:test

      - name: Root build files unchanged by this lane
        run: git diff --exit-code -- build.gradle.kts settings.gradle.kts gradle.properties gradle/libs.versions.toml core-engine/build.gradle.kts app/build.gradle.kts
