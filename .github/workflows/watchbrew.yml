name: WatchBrew
on:
  push:
    paths: ['watchbrew/**', 'settings.gradle.kts', 'build.gradle.kts', 'gradle/**', 'config/allowed-licenses.json', '.github/workflows/watchbrew.yml']
  pull_request:
    paths: ['watchbrew/**', 'settings.gradle.kts', 'build.gradle.kts', 'gradle/**', 'config/allowed-licenses.json', '.github/workflows/watchbrew.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: watchbrew-${{ github.ref }}
  cancel-in-progress: true
jobs:
  watch-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Test, lint, check licenses and build standalone watch demo
        run: ./gradlew -PwatchbrewOnly=true :watchbrew:testDebugUnitTest :watchbrew:lintDebug :watchbrew:checkLicense :watchbrew:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watchbrew-demo
          path: |
            watchbrew/build/outputs/apk/debug/*.apk
            watchbrew/build/reports/
